{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-card card animate-scaleIn">
            <div class="card-header text-center">
                <h1><i class="fas fa-user-plus"></i> Create Account</h1>
                <p class="text-muted">Join EasiVisi and start training models</p>
            </div>

            <div class="card-body">
                <form method="POST" action="/auth/register">
                    <div class="form-group">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-input" placeholder="Choose a username" required
                            autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-input" placeholder="your.email@example.com"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Full Name (Optional)</label>
                        <input type="text" name="full_name" class="form-input" placeholder="Your full name">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-input" placeholder="At least 8 characters"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-input"
                            placeholder="Re-enter password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                </form>

                <div class="auth-links" style="margin-top: 1.5rem; text-align: center;">
                    <p class="text-muted">
                        Already have an account?
                        <a href="/auth/login" style="color: var(--primary-600); font-weight: 500;">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .auth-page {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--primary-50) 0%, var(--accent-50) 100%);
        padding: var(--space-8) var(--space-4);
    }

    [data-theme="dark"] .auth-page {
        background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
    }

    .auth-container {
        width: 100%;
        max-width: 450px;
    }

    .auth-card {
        box-shadow: var(--shadow-xl);
    }

    .auth-card .card-header {
        background: linear-gradient(135deg, var(--primary-600) 0%, var(--accent-600) 100%);
        color: white;
        padding: var(--space-8);
        border-bottom: none;
    }

    .auth-card .card-header h1 {
        color: white;
        margin-bottom: var(--space-2);
        font-size: 1.75rem;
    }

    .auth-card .card-header p {
        color: rgba(255, 255, 255, 0.9);
        margin: 0;
    }

    .auth-card .card-body {
        padding: var(--space-8);
    }
</style>
{% endblock %}
