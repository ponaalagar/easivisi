<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EasiVisi{% endblock %} - Visual AI Training Platform</title>
    <meta name="description" content="Train custom YOLO object detection models without writing code">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo/favicon.png') }}">

    <!-- Modern Design System -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block head %}{% endblock %}
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <i class="fas fa-eye"></i>
                <span>EasiVisi</span>
            </a>

            <div class="nav-links">
                <a href="/" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
                    <i class="fas fa-home"></i> Home
                </a>
                <a href="/dataset"
                    class="nav-link {% if request.endpoint and 'dataset' in request.endpoint %}active{% endif %}">
                    <i class="fas fa-database"></i> Datasets
                </a>
                <a href="/train" class="nav-link {% if request.endpoint == 'train_page' %}active{% endif %}">
                    <i class="fas fa-cogs"></i> Train
                </a>
                <a href="/inference" class="nav-link {% if request.endpoint == 'inference_page' %}active{% endif %}">
                    <i class="fas fa-search"></i> Inference
                </a>
                <a href="/runs" class="nav-link {% if request.endpoint == 'runs_page' %}active{% endif %}">
                    <i class="fas fa-history"></i> Runs
                </a>
            </div>

            <div class="nav-actions">
                <!-- Theme Toggle -->
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
                    <i class="fas fa-sun" id="lightIcon"></i>
                    <i class="fas fa-moon" id="darkIcon" style="display: none;"></i>
                </button>

                <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <a href="/" class="mobile-link">Home</a>
        <a href="/dataset" class="mobile-link">Datasets</a>
        <a href="/train" class="mobile-link">Train</a>
        <a href="/inference" class="mobile-link">Inference</a>
        <a href="/runs" class="mobile-link">Runs</a>
    </div>

    <!-- Main Content -->
    <main class="main-content animate-fadeInUp">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 EasiVisi - Visual AI Training Platform</p>
            <p>Powered by <a href="https://ultralytics.com" target="_blank">Ultralytics YOLOv8</a></p>
        </div>
    </footer>

    <!-- Theme Toggle Script (Load First) -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>

    <!-- Common Scripts -->
    <script>
        // Mobile menu toggle
        document.getElementById('navToggle')?.addEventListener('click', () => {
            const mobileMenu = document.getElementById('mobileMenu');
            mobileMenu.classList.toggle('active');

            // Update icon
            const icon = document.querySelector('#navToggle i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            const mobileMenu = document.getElementById('mobileMenu');
            const navToggle = document.getElementById('navToggle');

            if (mobileMenu.classList.contains('active') &&
                !mobileMenu.contains(e.target) &&
                !navToggle.contains(e.target)) {
                mobileMenu.classList.remove('active');
                document.querySelector('#navToggle i').classList.replace('fa-times', 'fa-bars');
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>

</html>
